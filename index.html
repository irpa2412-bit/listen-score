<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12203a"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><title>Listen &amp; Score</title>
<style>
:root{--bg:#12203a;--panel:#1b2d4f;--ink:#e8eefc;--dim:#9aadd0;--acc:#5fd6c4;--rec:#ff5d6c}*{box-sizing:border-box}body{margin:0 auto;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);max-width:760px;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif}h1{font-size:21px;margin:14px 0 2px}#msg{position:sticky;top:0;z-index:5;background:var(--bg);color:var(--dim);padding:7px 0;min-height:32px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}button,select,input{border:0;border-radius:11px;padding:12px 9px;background:var(--panel);color:var(--ink);font:inherit;min-width:0}button{flex:1}button:disabled{opacity:.4}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc)}#rec{background:var(--rec);font-weight:700}#rec.on{animation:p 1s infinite}@keyframes p{50%{opacity:.6}}#up{flex:1;text-align:center;background:var(--panel);border-radius:11px;padding:12px 8px}details{background:var(--panel);border-radius:12px;padding:10px 12px;margin:8px 0}summary{cursor:pointer}label{display:flex;align-items:center;gap:9px;margin:8px 0;color:var(--dim);font-size:14px}label input,label select{flex:1;background:var(--bg);width:45%}#score{background:white;color:black;border-radius:12px;min-height:80px;overflow-x:auto}progress{width:100%;display:none}@media print{body{background:white}body>*:not(#score){display:none!important}#score{overflow:visible}}
</style></head><body>
<h1>Listen &amp; Score</h1><div id="msg">Record music or open an audio file to create staff notation.</div>
<div class="row"><button id="rec">Record</button><button id="clip" disabled>Save clip</button><label id="up" for="file">Open audio file</label><input id="file" type="file" accept="audio/*" hidden></div><progress id="pg" max="100" value="0"></progress>
<details open><summary>Source, key, tempo and parts</summary>
<label>Source<select id="source"><option value="single">One voice/instrument</option><option value="poly">Several parts</option></select></label>
<label>Key<select id="key"><option value="auto">Auto</option></select></label>
<label>Tempo (BPM)<input id="bpm" type="number" min="40" max="220" value="92"></label>
<label>Time signature<select id="ts"><option value="auto">Auto</option><option value="2">2/4</option><option value="3">3/4</option><option value="4">4/4</option></select></label>
<label>Sensitivity<select id="sens"><option value=".5">Normal</option><option value=".35" selected>High</option><option value=".25">Maximum</option></select></label>
<div id="splits"><label>Bass below MIDI<input id="c0" type="number" value="52"></label><label>Tenor below MIDI<input id="c1" type="number" value="60"></label><label>Alto below MIDI<input id="c2" type="number" value="68"></label></div>
<div class="row"><button id="upd" disabled>Update score</button></div></details>
<div class="row"><button id="play" disabled>Play</button><button id="mid" disabled>MIDI</button><button id="xml" disabled>MusicXML</button><button id="prt" disabled>Print / PDF</button></div><div id="score"></div>
<script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@2.2.1/build/opensheetmusicdisplay.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id),status=s=>$('msg').textContent=s;
const KEYS=['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const FIFTH=[0,-5,2,-3,4,-1,6,1,-4,3,-2,5],MAJ=[6.35,2.23,3.48,2.33,4.38,4.09,2.52,5.19,2.39,3.66,2.29,2.88],MIN=[6.33,2.68,3.52,5.38,2.60,3.53,2.54,4.75,3.98,2.69,3.34,3.17];
const STEPS=[['C',0],['C',1],['D',0],['D',1],['E',0],['F',0],['F',1],['G',0],['G',1],['A',0],['A',1],['B',0]],FLATS=[['C',0],['D',-1],['D',0],['E',-1],['E',0],['F',0],['G',-1],['G',0],['A',-1],['A',0],['B',-1],['B',0]];
let raw=[],parts=[],xmlText='',audioClip=null,recorder=null,chunks=[],lastPoly=null,ctx=null,playing=[];
for(let i=0;i<12;i++)$('key').add(new Option(KEYS[i]+' major','M'+i));
for(let i=0;i<12;i++)$('key').add(new Option(KEYS[i]+' minor','m'+i));
$('source').onchange=()=>$('splits').style.display=$('source').value==='poly'?'block':'none';$('source').onchange();
function yin(data,sr){const W=2048,H=512,min=Math.floor(sr/700),max=Math.ceil(sr/60),frames=[];
 for(let at=0;at+W<=data.length;at+=H){const x=data.subarray(at,at+W),d=new Float64Array(max+1);let energy=0;for(let j=0;j<W;j++)energy+=x[j]*x[j];if(energy<1e-7)continue;
  for(let tau=min;tau<=max;tau++){let sum=0;for(let j=0;j<W-tau;j++){let z=x[j]-x[j+tau];sum+=z*z}d[tau]=sum}
  let run=0;for(let t=1;t<=max;t++){run+=d[t];d[t]=d[t]*t/(run||1)}
  let tau=-1;for(let t=min;t<=max;t++)if(d[t]<.15){while(t<max&&d[t+1]<d[t])t++;tau=t;break}
  if(tau>0){const a=d[tau-1],b=d[tau],c=d[tau+1],off=.5*(a-c)/(a-2*b+c||1),hz=sr/(tau+off);if(hz>=60&&hz<=700)frames.push({t:at/sr,m:69+12*Math.log2(hz/440)})}
 }
 for(let i=0;i<frames.length;i++){const v=frames.slice(Math.max(0,i-2),i+3).map(x=>x.m).sort((a,b)=>a-b);frames[i].m=v[Math.floor(v.length/2)]}
 const notes=[];let start=null,last=null,pitch=null,count=0;
 const flush=()=>{if(start!==null&&count*H/sr>=.12)notes.push({pitchMidi:pitch,startTimeSeconds:start,durationSeconds:last-start+H/sr,amplitude:.8})};
 for(const f of frames){const p=Math.round(f.m);if(pitch===p&&f.t-last<=H/sr*1.6){last=f.t;count++}else{flush();start=f.t;last=f.t;pitch=p;count=1}}flush();return notes}
function histKey(notes){const h=Array(12).fill(0);notes.forEach(n=>h[((Math.round(n.pitchMidi)%12)+12)%12]+=n.durationSeconds);let best={t:0,minor:false,s:-Infinity};
 for(let t=0;t<12;t++)for(const minor of [false,true]){const p=minor?MIN:MAJ,mean=p.reduce((a,b)=>a+b)/12,hm=h.reduce((a,b)=>a+b)/12;let a=0,b=0,c=0;for(let k=0;k<12;k++){let x=p[(k-t+12)%12]-mean,y=h[k]-hm;a+=x*y;b+=x*x;c+=y*y}const s=a/Math.sqrt(b*c||1);if(s>best.s)best={t,minor,s}}
 return best}
function getKey(){const v=$('key').value;return v==='auto'?histKey(raw):{t:+v.slice(1),minor:v[0]==='m'}}
function pitchInKey(m,k){const scale=(k.minor?[0,2,3,5,7,8,11]:[0,2,4,5,7,9,11]).map(x=>(x+k.t)%12);let best=m,dist=99;for(let q=m-1;q<=m+1;q++)if(scale.includes((q%12+12)%12)&&Math.abs(q-m)<dist){best=q;dist=Math.abs(q-m)}return best}
function estimateTempo(ns){if(ns.length<2)return 92;const ts=ns.map(n=>n.startTimeSeconds).sort((a,b)=>a-b),ds=[];for(let i=1;i<ts.length;i++){let d=ts[i]-ts[i-1];if(d>.08&&d<2)ds.push(d)}if(!ds.length)return 92;let best={b:92,s:-1};for(let b=50;b<=180;b++){let beat=60/b,s=0;for(const d of ds){let r=d/beat,k=Math.max(1,Math.round(r));s+=Math.exp(-Math.pow((r-k)/.18,2))}if(s>best.s)best={b,s}}return best.b}
function meterDetect(ns,bpm){const beat=60/bpm,ev=ns.map(n=>({t:n.startTimeSeconds,w:Math.max(.1,n.amplitude||.5)}));let best={m:4,s:-1};for(const m of [2,3,4])for(let ph=0;ph<beat;ph+=beat/16){let s=0;for(const e of ev){let q=((e.t-ph)/beat%m+m)%m,nearest=Math.round(q)%m;s+=e.w*(nearest===0?1.8:nearest===Math.floor(m/2)?1.15:.45)}if(s>best.s)best={m,s,ph}}return best.m}
const durVals=[1,2,3,4,6,8,12,16],splitDur=d=>{let a=[];while(d>0){let n=durVals.filter(x=>x<=d).pop();a.push(n);d-=n}return a};
function quantize(notes,bpm){const six=60/bpm/4,origin=Math.min(...notes.map(n=>n.startTimeSeconds));return notes.map(n=>({m:pitchInKey(Math.round(n.pitchMidi),getKey()),s:Math.max(0,Math.round((n.startTimeSeconds-origin)/six)),d:Math.max(1,Math.round(n.durationSeconds/six)),a:n.amplitude||.5}))}
function makeParts(){let ns=quantize(raw,+$('bpm').value||92);ns.sort((a,b)=>a.s-b.s);const cuts=[+$('c0').value,+$('c1').value,+$('c2').value];if($('source').value==='single'){const med=ns.map(n=>n.m).sort((a,b)=>a-b)[Math.floor(ns.length/2)];return[{name:'Voice / Instrument',clef:med<57?'F':'G',notes:ns}]}
 const p=[{name:'Bass',clef:'F',notes:[]},{name:'Tenor',clef:'G',notes:[]},{name:'Alto',clef:'G',notes:[]},{name:'Soprano',clef:'G',notes:[]}];ns.forEach(n=>p[n.m<cuts[0]?0:n.m<cuts[1]?1:n.m<cuts[2]?2:3].notes.push(n));return p.filter(x=>x.notes.length).reverse()}
function xmlNote(m,d,div,tie){const acc=(div<0?FLATS:STEPS)[m%12];return '<note><pitch><step>'+acc[0]+'</step>'+(acc[1]?'<alter>'+acc[1]+'</alter>':'')+'<octave>'+(Math.floor(m/12)-1)+'</octave></pitch><duration>'+d+'</duration><type>'+({1:'16th',2:'eighth',3:'eighth',4:'quarter',6:'quarter',8:'half',12:'half',16:'whole'}[d]||'16th')+'</type>'+(d===3||d===6||d===12?'<dot/>':'')+(tie?'<tie type="start"/><notations><tied type="start"/></notations>':'')+'</note>'}
function makeXML(){const k=getKey(),f=FIFTH[k.minor?(k.t+3)%12:k.t],beats=+$('ts').value||4,M=beats*4,all=parts.flatMap(p=>p.notes),end=Math.max(1,...all.map(n=>n.s+n.d)),bars=Math.ceil(end/M);let out='<?xml version="1.0"?><score-partwise version="3.1"><part-list>'+parts.map((p,i)=>'<score-part id="P'+i+'"><part-name>'+p.name+'</part-name></score-part>').join('')+'</part-list>';
 parts.forEach((p,i)=>{out+='<part id="P'+i+'">';for(let b=0;b<bars;b++){let start=b*M,stop=start+M,items=p.notes.filter(n=>n.s>=start&&n.s<stop).sort((a,b)=>a.s-b.s),pos=start,body='';for(const n of items){if(n.s>pos)body+='<note><rest/><duration>'+Math.min(n.s-pos,stop-pos)+'</duration><type>quarter</type></note>';let d=Math.min(n.d,stop-n.s);for(const q of splitDur(d))body+=xmlNote(n.m,q,f,n.d>stop-n.s);pos=n.s+d}if(pos<stop)body+='<note><rest/><duration>'+(stop-pos)+'</duration><type>quarter</type></note>';out+='<measure number="'+(b+1)+'">'+(b===0?'<attributes><divisions>4</divisions><key><fifths>'+f+'</fifths></key><time><beats>'+beats+'</beats><beat-type>4</beat-type></time><clef><sign>'+p.clef+'</sign><line>'+(p.clef==='F'?4:2)+'</line></clef></attributes>':'')+body+'</measure>'}out+='</part>'});return out+'</score-partwise>'}
async function draw(){if(!raw.length)return;const bpm=+$('bpm').value||92,det=getKey();parts=makeParts();const xml=makeXML();xmlText=xml;try{const osmd=new opensheetmusicdisplay.OpenSheetMusicDisplay('score',{autoResize:true,drawTitle:true,drawPartNames:true});await osmd.load(xml);osmd.render()}catch(e){status('Score renderer error: '+e.message)}status('Detected / selected: '+KEYS[det.t]+(det.minor?' minor':' major')+' · '+$('ts').value+'/4 · '+bpm+' BPM · '+raw.length+' notes');['play','mid','xml','prt','upd'].forEach(id=>$(id).disabled=false)}
async function process(buf){try{status('Decoding audio…');const ac=new(window.AudioContext||window.webkitAudioContext)(),ab=await ac.decodeAudioData(buf),data=ab.getChannelData(0);if($('source').value==='single')raw=yin(data,ab.sampleRate);else{status('Loading Basic Pitch…');const BP=await import('https://cdn.jsdelivr.net/npm/@spotify/basic-pitch@1.0.1/+esm'),bp=new BP.BasicPitch('https://cdn.jsdelivr.net/npm/@spotify/basic-pitch@1.0.1/model/model.json'),F=[],O=[];await bp.evaluateModel(data,(f,o)=>{F.push(...f);O.push(...o)},p=>$('pg').value=p*100);raw=BP.noteFramesToTime(BP.outputToNotesPoly(F,O,+$('sens').value,.2,6)).filter(n=>n.durationSeconds>=.12)}await ac.close();if(!raw.length)throw Error('No stable notes detected');$('bpm').value=estimateTempo(raw);$('ts').value=meterDetect(raw,+$('bpm').value);$('key').value='auto';await draw()}catch(e){status('Audio processing failed: '+e.message)}}
$('file').onchange=async e=>{const f=e.target.files[0];if(f)await process(await f.arrayBuffer());e.target.value=''};
let timer=null;$('rec').onclick=async()=>{if(recorder&&recorder.state==='recording'){recorder.stop();return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());$('rec').classList.remove('on');$('rec').textContent='Record';clearInterval(timer);audioClip=new Blob(chunks,{type:recorder.mimeType});$('clip').disabled=false;await process(await audioClip.arrayBuffer())};recorder.start();$('rec').classList.add('on');const t=Date.now();timer=setInterval(()=>$('rec').textContent='Stop '+Math.floor((Date.now()-t)/1000)+'s',500)}catch(e){status('Microphone unavailable: '+e.message)}};
$('upd').onclick=draw;
function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
$('clip').onclick=()=>audioClip&&save(audioClip,'listen-score-recording.webm');
$('xml').onclick=()=>save(new Blob([xmlText],{type:'application/vnd.recordare.musicxml+xml'}),'listen-score.musicxml');
$('prt').onclick=()=>print();
$('play').onclick=async()=>{if(playing.length){playing.forEach(o=>{try{o.stop()}catch(e){}});playing=[];return}ctx=ctx||new AudioContext();await ctx.resume();const beat=60/(+$('bpm').value||92)/4,t=ctx.currentTime+.1;parts.forEach((p,i)=>p.notes.forEach(n=>{const o=ctx.createOscillator(),g=ctx.createGain(),s=t+n.s*beat,d=n.d*beat;o.frequency.value=440*2**((n.m-69)/12);g.gain.setValueAtTime(.1,s);g.gain.setValueAtTime(.1,s+d*.9);g.gain.linearRampToValueAtTime(0,s+d);o.connect(g);g.connect(ctx.destination);o.start(s);o.stop(s+d);playing.push(o)}));setTimeout(()=>playing=[],Math.max(1000,...parts.flatMap(p=>p.notes.map(n=>(n.s+n.d)*beat*1000))))};
$('mid').onclick=()=>{const ev=[];parts.forEach((p,i)=>p.notes.forEach(n=>{ev.push({t:n.s*120,b:[0x90|i,n.m,90]},{t:(n.s+n.d)*120,b:[0x80|i,n.m,0]})}));ev.sort((a,b)=>a.t-b.t);let tr=[0,255,81,3,3,39,16],prev=0;for(const e of ev){let d=e.t-prev;prev=e.t;let v=[d&127];while(d>>=7)v.unshift((d&127)|128);tr.push(...v,...e.b)}tr.push(0,255,47,0);const len=tr.length;save(new Blob([new Uint8Array([77,84,104,100,0,0,0,6,0,1,0,1,1,224,77,84,114,107,len>>>24,(len>>>16)&255,(len>>>8)&255,len&255,...tr])],{type:'audio/midi'}),'listen-score.mid')};
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
